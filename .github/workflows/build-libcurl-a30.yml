name: Build libcurl (A30 / armhf)

on:
  workflow_dispatch:
    inputs:
      curl_version:
        description: 'curl version'
        default: '8.17.0'
      openssl_version:
        description: 'OpenSSL 1.1 version'
        default: '1.1.1w'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "DSperate binaries built from ${{ github.ref_name }}" \
            || true

      - name: Download A30 toolchain
        run: |
          wget -q -O a30_toolchain-v1.0.tar.gz \
            "https://github.com/steward-fu/website/releases/download/miyoo-a30/a30_toolchain-v1.0.tar.gz"

      - name: Build Docker image
        run: docker build -f Dockerfile.a30 -t dsperate-builder-a30 .

      - name: Build libcurl
        run: |
          mkdir -p output
          docker run --rm \
            --entrypoint /bin/bash \
            -e CURL_VERSION=${{ inputs.curl_version || '8.17.0' }} \
            -e OPENSSL_VERSION=${{ inputs.openssl_version || '1.1.1w' }} \
            -v ${{ github.workspace }}/build-libcurl-a30.sh:/build-libcurl-a30.sh:ro \
            -v ${{ github.workspace }}/output:/output \
            dsperate-builder-a30 /build-libcurl-a30.sh

      - name: Upload libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          tar czf ../libcurl-a30.tar.gz .
          cd ..
          gh release upload "beta-${{ github.ref_name }}" libcurl-a30.tar.gz --clobber
