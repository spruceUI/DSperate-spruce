name: Build mupen64plus-pow2 (aarch64)

on:
  workflow_dispatch:
    inputs:
      pow2_owner:
        description: 'mupen64plus-pow2 fork owner/organization'
        type: string
        default: 'beebono'
      pow2_version:
        description: 'mupen64plus-pow2 branch/tag/commit'
        default: 'devel'
  workflow_call:
    inputs:
      pow2_owner:
        type: string
        default: 'beebono'
      pow2_version:
        type: string
        default: 'devel'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "Binaries built from ${{ github.ref_name }}" \
            || true

      - name: Build Docker image
        run: docker build -t pow2-builder pow2

      - name: Build mupen64plus-pow2
        run: |
          mkdir -p output
          docker run --rm \
            -e POW2_REPO="https://github.com/${{ inputs.pow2_owner }}/mupen64plus-pow2.git" \
            -e POW2_VERSION="${{ inputs.pow2_version || 'devel' }}" \
            -v ${{ github.workspace }}/output:/output \
            pow2-builder

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          tar czf ../mupen64plus-pow2-aarch64.tar.gz .
          cd ..
          gh release upload "beta-${{ github.ref_name }}" mupen64plus-pow2-aarch64.tar.gz --clobber
