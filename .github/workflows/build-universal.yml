name: Build DSperate (aarch64)

on:
  workflow_dispatch:
    inputs:
      dsperate_version:
        description: 'DSperate branch/tag/commit'
        default: 'main'
      skip_tests:
        description: 'Skip the qemu-aarch64 unit tests'
        type: boolean
        default: false
  workflow_call:
    inputs:
      dsperate_version:
        type: string
        default: 'main'
      skip_tests:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure beta release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "${{ github.ref_name }}" \
              --title "Beta Build (${{ github.ref_name }})" \
              --prerelease \
              --notes "DSperate binaries built from ${{ github.ref_name }}" \
            || true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ccache-aarch64
          key: ccache-dsperate-aarch64-${{ github.sha }}
          restore-keys: ccache-dsperate-aarch64-

      - name: Build Docker image
        run: docker build -t dsperate-builder .

      - name: Build DSperate
        run: |
          mkdir -p output ccache-aarch64
          docker run --rm \
            -e DSPERATE_VERSION=${{ inputs.dsperate_version || 'main' }} \
            -e SKIP_TESTS=${{ inputs.skip_tests && '1' || '0' }} \
            -e CCACHE_DIR=/ccache \
            -v ${{ github.workspace }}/output:/output \
            -v ${{ github.workspace }}/ccache-aarch64:/ccache \
            dsperate-builder

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          tar czf ../dsperate-aarch64.tar.gz .
          cd ..
          gh release upload "beta-${{ github.ref_name }}" dsperate-aarch64.tar.gz --clobber
